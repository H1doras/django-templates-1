{% extends "auth_base.html" %}
{% load crispy_forms_tags %}
{% block start %}
<main class="auth-card">
  <p class="auth-kicker">Security</p>
  <h1>Change password</h1>
  <p class="auth-copy">Choose a strong password you do not use elsewhere.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="auth-button">Update password</button>
  </form>
  <p class="auth-link"><a href="{% url 'account' %}">Back to my account</a></p>
</main>
{% endblock start %}
