{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'index.css' %}">
  <style>
    :root { --ink: #24312d; --muted: #6c7873; --paper: #f5f1e9; --card: #fffdf8; --accent: #c75c3b; --line: #d9d7cd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 15% 10%, #e7eee3 0, transparent 35%), var(--paper); font-family: 'DM Sans', sans-serif; }
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .auth-card { width: min(100%, 480px); padding: clamp(30px, 7vw, 64px); background: color-mix(in srgb, var(--card) 94%, transparent); border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(36, 49, 45, .10); }
    .auth-kicker { margin: 0 0 28px; color: var(--accent); font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.08; }
    .auth-copy { margin: 12px 0 30px; color: var(--muted); }
    .auth-form p { margin: 0 0 18px; }
    .auth-form label { display: block; margin-bottom: 6px; font-size: .85rem; font-weight: 700; }
    .auth-form input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 2px; background: #fff; color: var(--ink); font: inherit; }
    .auth-form input:focus { outline: 2px solid rgba(199, 92, 59, .28); border-color: var(--accent); }
    .auth-form .help-block, .auth-form ul { color: #a33f2d; font-size: .82rem; }
    .auth-form ul { padding-left: 18px; }
    .auth-button { width: 100%; min-height: 48px; margin-top: 8px; border: 0; border-radius: 2px; background: var(--ink); color: white; cursor: pointer; font: inherit; font-weight: 700; }
    .auth-button:hover { background: var(--accent); }
    .auth-link { margin: 26px 0 0; color: var(--muted); font-size: .9rem; text-align: center; }
    .auth-link a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .account-shell { width: min(100%, 980px); }
    .account-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .account-header .auth-kicker { margin-bottom: 14px; }
    .account-header .auth-copy { max-width: 580px; margin-bottom: 0; }
    .account-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .account-link { color: var(--accent); font-size: .9rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .account-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(240px, .75fr); gap: 20px; }
    .account-panel { padding: 28px; background: var(--card); border: 1px solid var(--line); }
    .account-panel h2 { margin: 0; font-family: 'Playfair Display', serif; font-size: 1.65rem; }
    .panel-copy { margin: 8px 0 24px; color: var(--muted); font-size: .9rem; }
    .summary-row { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    .summary-row strong { color: var(--ink); overflow-wrap: anywhere; text-align: right; }
    .secondary-button { display: block; margin: 24px 0 20px; padding: 13px 16px; border: 1px solid var(--ink); color: var(--ink); font-size: .9rem; font-weight: 700; text-align: center; text-decoration: none; }
    .secondary-button:hover { background: var(--ink); color: white; }
    .secondary-button-alt { margin-top: 0; }
    .recent-panel { margin-top: 24px; }
    .recent-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .recent-header h2 { margin: 0; font-family: 'Playfair Display', serif; font-size: 1.65rem; }
    .smaller { margin-bottom: 8px; }
    .recent-list { display: grid; gap: 14px; }
    .recent-item { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
    .recent-item:first-child { border-top: 0; }
    .recent-image { width: 80px; height: 80px; border-radius: 14px; overflow: hidden; background: linear-gradient(135deg, #e7eee3, #efe1c4); }
    .recent-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .recent-placeholder { width: 100%; height: 100%; display: grid; place-items: center; font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--accent); }
    .recent-copy h3 { margin: 0 0 6px; font-family: 'Playfair Display', serif; font-size: 1.15rem; }
    .recent-copy p { margin: 0; color: var(--muted); font-size: .86rem; }
    .recent-meta { text-align: right; }
    .recent-meta strong { display: block; font-size: 1rem; }
    .recent-meta span { color: var(--muted); font-size: .8rem; }
    .empty-state { margin-bottom: 0; }
    @media (max-width: 700px) { .account-header { display: block; } .account-actions { margin-top: 18px; } .account-grid { grid-template-columns: 1fr; } .recent-item { grid-template-columns: 64px 1fr; } .recent-meta { grid-column: 2; text-align: left; } }
  </style>
</head>
<body>
  <div class="auth-page">
    {% block start %}{% endblock %}
  </div>
</body>
</html>
