{% extends "auth_base.html" %}
{% load crispy_forms_tags %}
{% block start %}
<main class="auth-card">
  <p class="auth-kicker">Terra &amp; Salt</p>
  <h1>Welcome back</h1>
  <p class="auth-copy">Sign in to continue to your account.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="auth-button">Log in</button>
  </form>
  <p class="auth-link">New here? <a href="{% url 'register' %}">Create an account</a></p>
</main>
{% endblock start %}
